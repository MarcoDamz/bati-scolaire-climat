name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[pipeline,demo,dev]"
      - run: pytest -q
      - run: mkdir -p "$DAGSTER_HOME" && dagster definitions validate -m batiscol.definitions
        env:
          DAGSTER_HOME: ${{ runner.temp }}/dagster
      - run: marimo check demo.py
