name: sync-hf-space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push vers le Space Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" HEAD:main
