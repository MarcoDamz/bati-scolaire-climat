name: pipeline
# Calcule les résultats avec Dagster, puis publie le tableau de bord statique
# (export HTML du notebook marimo) et resultats.parquet sur GitHub Pages.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Code région INSEE (11 = Île-de-France ; vide = France entière)"
        default: "11"
      scenario:
        description: "Scénario chaleur (ssp126, ssp245, ssp585)"
        default: "ssp245"
      year:
        description: "Horizon chaleur (2030, 2040, 2050)"
        default: "2050"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[pipeline,demo]"
      - name: Matérialisation Dagster
        env:
          DAGSTER_HOME: ${{ runner.temp }}/dagster
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          mkdir -p "$DAGSTER_HOME"
          CONFIG=$(python -c "import json,sys; r=sys.argv[1] or None; print(json.dumps({'resources': {'parametres': {'config': {'region': r, 'scenario_chaleur': sys.argv[2], 'annee_chaleur': int(sys.argv[3])}}}}))" '${{ inputs.region }}' '${{ inputs.scenario }}' '${{ inputs.year }}')
          dagster asset materialize -m batiscol.definitions --select '*' --config-json "$CONFIG"
      - name: Export statique du tableau de bord
        env:
          RESULTS_PATH: data/resultats.parquet
          BATISCOL_STATIQUE: "1"
        run: |
          mkdir -p site
          marimo export html demo.py -o site/index.html
          cp data/resultats.parquet site/
      - name: Résumé
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          df = pd.read_parquet("data/resultats.parquet")
          print(f"### {len(df)} établissements")
          print(f"- rénovations connues : {(df['donnees_renovation'] == 'connues').sum()}")
          for c in ["jours_tmoy_sup_25c_futur", "inondation_m_rp100_futur", "score"]:
              print(f"- {c} : médiane {df[c].median():.2f}, max {df[c].max():.2f}, manquants {df[c].isna().sum()}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: resultats
          path: data/resultats.parquet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
