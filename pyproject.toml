[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "batiscol"
version = "0.3.0"
description = "Exposition des collèges et lycées publics aux aléas climatiques (physrisk-lib)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pandas>=2.2", "pyarrow>=15", "numpy>=1.26", "requests>=2.32"]

[project.optional-dependencies]
pipeline = ["physrisk-lib>=1.11", "dagster>=1.10", "huggingface_hub>=0.25"]
demo = ["marimo>=0.20", "folium>=0.17"]
adaptation = ["scipy>=1.11", "xarray>=2024.1", "h5netcdf>=1.3", "h5py>=3.10", "fsspec>=2024.2", "aiohttp>=3.9"]
dev = ["pytest>=8", "dagster-webserver>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptation = ["ressources/*.csv"]

[tool.dagster]
module_name = "batiscol.definitions"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
